services:
  jupyter-spark:
    build:
      context: .
      dockerfile: Dockerfile
    # Borra o comenta la línea container_name:
    # container_name: jupyter_dev_container
    user: root
    privileged: true
    ports:
      - "8888:8888"
    volumes:
      - jupyter_data:/workspace
      - .:/workspace
    working_dir: /workspace
    environment:
      - JUPYTER_ENABLE_LAB=yes
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "6.0"
    #       memory: 12G

volumes:
  jupyter_data:
    driver: local
