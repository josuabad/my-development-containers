services:
  jupyter-spark:
    # Choose between using an image or building from a Dockerfile.
    # Uncomment the line below to use a pre-built image,
    # or comment it out to build from the Dockerfile.
    image: my_jupyterlab_image:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # Borra o comenta la línea container_name:
    # container_name: jupyter_dev_container
    user: root
    privileged: true
    ports:
      - "8888:8888"
    volumes:
      - jupyterlab_data:/workspace
      - .:/workspace
    working_dir: /workspace
    environment:
      - JUPYTER_ENABLE_LAB=yes
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "6.0"
    #       memory: 12G

volumes:
  jupyterlab_data:
    driver: local
